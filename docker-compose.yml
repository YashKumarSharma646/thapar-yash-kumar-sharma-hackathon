name: ripple

x-app: &app
  env_file: [.env.example]
  environment:
    REDIS_URL: redis://redis:6379/0
    API_URL: http://api:8000
  depends_on:
    redis: { condition: service_healthy }

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    build: { context: ., target: base }
    image: ripple-base
    command: uvicorn ripple.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  engine:
    <<: *app
    build: { context: ., target: engine }
    image: ripple-engine
    command: python -m ripple.engine.worker
    volumes:
      - ./data/processed:/app/data/processed   # signals.jsonl is written to the host

  ingestor:
    <<: *app
    build: { context: ., target: base }
    image: ripple-base
    command: python -m ripple.ingestion.run
    depends_on:
      redis: { condition: service_healthy }
      engine: { condition: service_started }

  dashboard:
    <<: *app
    build: { context: ., target: base }
    image: ripple-base
    command: streamlit run src/ripple/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]

  # Day 6-7:
  # stress_test:  python -m ripple.stress_test.worker
